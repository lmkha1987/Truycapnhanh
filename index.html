<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Truy cập nhanh</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f5f9;
            color: #222;
        }

        /* =========================
           KHUNG CHÍNH
        ========================== */

        .layout {
            max-width: 1500px;
            margin: auto;
            padding: 15px;

            display: grid;
            grid-template-columns: 240px minmax(350px, 600px) 240px;
            gap: 20px;

            align-items: start;
        }

        /* =========================
           KHU VỰC QUẢNG CÁO
        ========================== */

        .advertising {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ad-box {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 3px 12px rgba(0,0,0,0.12);

            position: relative;
        }

        .ad-box img {
            width: 100%;
            display: block;
            height: auto;
        }

        .ad-label {
            position: absolute;
            top: 6px;
            right: 6px;

            background: rgba(0,0,0,0.55);
            color: white;

            padding: 3px 7px;
            border-radius: 5px;

            font-size: 10px;
        }

        /* =========================
           NỘI DUNG CHÍNH
        ========================== */

        .main {
            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #0756a8;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;

            margin-bottom: 25px;

            font-size: 14px;
        }

        /* =========================
           CÁC NÚT TRUY CẬP
        ========================== */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .quick-button {
            display: flex;

            align-items: center;

            text-decoration: none;

            background: #0756a8;

            color: white;

            padding: 17px 20px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            transition: all 0.2s ease;

            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .quick-button:hover {
            transform: translateY(-2px);

            background: #063f7c;

            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 25px;

            width: 40px;

            text-align: center;

            margin-right: 10px;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            text-align: center;

            margin-top: 25px;

            padding-top: 15px;

            border-top: 1px solid #eee;

            font-size: 12px;

            color: #888;
        }

        /* =========================
           ĐIỆN THOẠI
        ========================== */

        @media (max-width: 900px) {

            .layout {
                display: flex;

                flex-direction: column;

                padding: 10px;

                gap: 12px;
            }

            .main {
                width: 100%;

                order: 2;

                padding: 18px;
            }

            /* Banner vẫn hiển thị */

            .advertising {
                width: 100%;

                order: 1;

                flex-direction: row;

                overflow-x: auto;

                gap: 10px;
            }

            .advertising .ad-box {
                min-width: 72%;

                flex-shrink: 0;
            }

            /* Banner thứ hai đưa xuống dưới */

            .right-ad {
                order: 3;

                width: 100%;
            }

            .right-ad .advertising {
                flex-direction: row;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 35px;
            }

            .quick-button {
                font-size: 16px;

                padding: 15px;
            }
        }

        /* =========================
           ĐIỆN THOẠI NHỎ
        ========================== */

        @media (max-width: 480px) {

            .layout {
                padding: 7px;
            }

            .main {
                padding: 15px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .quick-button {
                font-size: 15px;

                padding: 14px;
            }

            .icon {
                font-size: 22px;

                width: 35px;
            }

            .advertising .ad-box {
                min-width: 85%;
            }
        }

    </style>
</head>

<body>

<div class="layout">

    <!-- ==================================

    =================================== -->

    <aside class="advertising">

        <a class="ad-box"

            <span class="ad-label">QUẢNG CÁO</span>

        <div class="buttons">

            <!-- 3 -->

            <!-- 6 -->

        </div>


        <footer>

    </main>


    <!-- ==================================
         BANNER QUẢNG CÁO BÊN PHẢI
    =================================== -->

    <aside class="advertising right-ad">

        <a class="ad-box"
           href="https://example.com"
           target="_blank">

            <span class="ad-label">QUẢNG CÁO</span>

            <img src="images/banner-right-1.jpg"
                 alt="Quảng cáo">
        </a>

        <a class="ad-box"
           href="https://example.com"
           target="_blank">

            <span class="ad-label">QUẢNG CÁO</span>

            <img src="images/banner-right-2.jpg"
                 alt="Quảng cáo">
        </a>

    </aside>

</div>

</body>
</html>

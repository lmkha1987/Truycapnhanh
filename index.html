<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cổng dữ liệu giáo dục</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 10% 20%, #dff5ff, transparent 30%),
        radial-gradient(circle at 90% 80%, #eee5ff, transparent 30%),
        linear-gradient(135deg, #f5faff, #eef1ff);

    color: #172033;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 100vh;
}

/* =========================
   KHUNG CHÍNH
========================= */

.container {
    width: 100%;
    max-width: 900px;

    padding: 30px 20px;

    text-align: center;
}

/* =========================
   BIỂU TƯỢNG
========================= */

.logo {
    font-size: 65px;
    margin-bottom: 8px;
}

/* =========================
   TIÊU ĐỀ
========================= */

h1 {
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 32px;

    font-weight: 800;

    color: #3159e8;
}

.subtitle {
    margin-top: 10px;
    margin-bottom: 35px;

    color: #68738a;

    font-size: 16px;
}

/* =========================
   2 LỰA CHỌN
========================= */

.choice-container {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;
}

/* =========================
   Ô LỰA CHỌN
========================= */

.choice {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 300px;

    padding: 30px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    overflow: hidden;

    box-shadow:
        0 15px 40px rgba(40,70,130,0.20);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.choice:hover {

    transform: translateY(-7px);

    box-shadow:
        0 22px 45px rgba(40,70,130,0.28);
}

/* =========================
   MÀU THÍ SINH
========================= */

.student {

    background:
        linear-gradient(
            135deg,
            #007bff,
            #00b7ff
        );
}

/* =========================
   MÀU QUẢN TRỊ
========================= */

.school {

    background:
        linear-gradient(
            135deg,
            #6636c9,
            #a64cff
        );
}

/* =========================
   ICON
========================= */

.choice-icon {

    font-size: 65px;

    margin-bottom: 15px;
}

/* =========================
   TIÊU ĐỀ Ô
========================= */

.choice h2 {

    margin: 0;

    font-size: 24px;

    font-weight: 800;
}

/* =========================
   MÔ TẢ
========================= */

.choice p {

    margin: 12px 0 22px;

    font-size: 14px;

    line-height: 1.5;

    opacity: 0.95;
}

/* =========================
   NÚT TRUY CẬP
========================= */

.enter {

    padding: 11px 27px;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.22);

    border:
        1px solid rgba(255,255,255,0.5);

    font-weight: bold;

    transition:
        background 0.2s ease;
}

.choice:hover .enter {

    background:
        rgba(255,255,255,0.35);
}

/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 30px;

    font-size: 12px;

    color: #8992a3;
}

/* =========================
   ĐIỆN THOẠI
========================= */

@media (max-width: 650px) {

    .container {
        padding: 25px 15px;
    }

    .logo {
        font-size: 52px;
    }

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 14px;
        margin-bottom: 25px;
    }

    .choice-container {

        grid-template-columns: 1fr;

        gap: 15px;
    }

    .choice {

        min-height: 220px;

        padding: 25px;
    }

    .choice-icon {
        font-size: 50px;
    }

    .choice h2 {
        font-size: 21px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🎓
    </div>

    <h1>
        CỔNG DỮ LIỆU GIÁO DỤC
    </h1>

    <div class="subtitle">
        Vui lòng chọn đối tượng để tiếp tục
    </div>


    <div class="choice-container">


        <!-- =========================
             THÍ SINH
        ========================== -->

        <a
            href="thisinh.html"
            class="choice student"
        >

            <div class="choice-icon">
                👨‍🎓
            </div>

            <h2>
                BẠN LÀ THÍ SINH
            </h2>

            <p>
                Tra cứu thông tin tốt nghiệp THPT
                và kết quả Đại học, Cao đẳng.
            </p>

            <div class="enter">
                TRUY CẬP →
            </div>

        </a>


        <!-- =========================
             QUẢN TRỊ TRƯỜNG
        ========================== -->

        <a
            href="quantri.html"
            class="choice school"
        >

            <div class="choice-icon">
                🏫
            </div>

            <h2>
                QUẢN TRỊ TRƯỜNG
            </h2>

            <p>
                Truy cập các chức năng
                dành cho nhà trường.
            </p>

            <div class="enter">
                TRUY CẬP →
            </div>

        </a>


    </div>


    <div class="footer">

        © 2026 - Trang truy cập dữ liệu giáo dục
        <br>
        by Lê Minh Kha

    </div>

</div>

</body>
</html>
